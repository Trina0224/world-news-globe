<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="description" content="Explore current news around the world, with direct Japan prefecture and US state maps." />
  <title>World News Globe</title>
  <link rel="stylesheet" href="styles.css?v=9" />
  <link rel="stylesheet" href="japan-overlay.css?v=3" />
  <link rel="stylesheet" href="us-overlay.css?v=1" />
</head>
<body>
  <div id="app">
    <div id="globe-wrap">
      <div id="globe" aria-label="Interactive world globe"></div>

      <div id="japanOverlay" class="japan-overlay hidden">
        <div class="japan-overlay-toolbar">
          <div id="japanOverlayTitle" class="japan-overlay-title">日本 · 47 都道府縣</div>
          <div class="japan-toolbar-actions">
            <button id="japanZoomOut" class="map-zoom-btn" type="button" aria-label="Zoom out">−</button>
            <button id="japanZoomReset" class="map-zoom-btn map-reset-btn" type="button">Reset</button>
            <button id="japanZoomIn" class="map-zoom-btn" type="button" aria-label="Zoom in">+</button>
            <button id="backWorldBtn" class="back-world-btn" type="button">← 返回世界</button>
          </div>
        </div>
        <div class="japan-map-frame">
          <svg id="japanOverlayMap" role="img" aria-label="Interactive map of Japan prefectures"></svg>
        </div>
      </div>

      <div id="usOverlay" class="us-overlay hidden">
        <div class="us-overlay-toolbar">
          <div id="usOverlayTitle" class="us-overlay-title">美國 · 50 州</div>
          <button id="usBackWorldBtn" class="us-back-world-btn" type="button">← 返回世界</button>
        </div>
        <div class="us-map-frame">
          <svg id="usOverlayMap" role="img" aria-label="Interactive map of the 50 US states"></svg>
        </div>
      </div>

      <div class="brand"><div class="eyebrow">NEWS · CACHED</div><div class="brand-title">WORLD NEWS GLOBE</div></div>
      <div class="hint" id="globeHint">拖曳旋轉 · 滾輪縮放 · 輕點國家</div>
      <div class="globe-status" id="globeStatus">Loading world…</div>
    </div>

    <aside id="panel">
      <div class="panel-topbar">
        <div><div class="eyebrow" id="locationType">WORLD</div><h1 id="locationName">選一個國家</h1></div>
        <div class="language-switch" role="group" aria-label="Language">
          <button type="button" data-lang="zh-Hant" class="active">繁中</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ja">日本語</button>
        </div>
      </div>
      <div class="meta-row"><span id="localTime">—</span><span class="dot">•</span><span id="newsWindow">最近 24 小時</span></div>
      <div id="regionControls" class="region-controls hidden"><label for="regionSelect" id="regionLabel">地區</label><select id="regionSelect"><option value="">全部</option></select></div>
      <div class="section-title-row"><h2 id="headlineLabel">今日新聞</h2><button type="button" id="refreshBtn" class="icon-btn" title="Refresh">↻</button></div>
      <div id="newsState" class="news-state"><div class="orb"></div><p id="emptyMessage">轉動地球，輕點一個國家看看今天發生什麼。</p></div>
      <ol id="newsList" class="news-list" aria-live="polite"></ol>
      <div class="panel-footer"><span id="sourceNote">新聞來源：Google News RSS；由 GitHub Actions 定期更新。</span><a href="https://news.google.com/" target="_blank" rel="noreferrer">Google News ↗</a></div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="app-v2.js?v=9"></script>
  <script src="news-static.js?v=10"></script>
  <script src="japan-overlay.js?v=3"></script>
  <script src="us-overlay.js?v=1"></script>
</body>
</html>
