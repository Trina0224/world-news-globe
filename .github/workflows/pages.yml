name: Deploy World News Globe

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Google News RSS
        run: python3 scripts/fetch_news.py
      - name: Build Japan prefecture map
        run: python3 scripts/fetch_japan_map.py
      - name: Validate generated news and map
        run: |
          test -s data/countries/jp.json
          test -s data/countries/us.json
          test -s data/maps/japan-prefectures.geojson
          python3 - <<'PY'
          import glob, json

          def read(path):
              with open(path, encoding='utf-8') as f:
                  return json.load(f)

          jp = read('data/countries/jp.json')
          us = read('data/countries/us.json')
          if len(jp.get('articles', [])) < 10:
              raise SystemExit('Japan national feed needs at least 10 headlines')
          if len(us.get('articles', [])) < 10:
              raise SystemExit('US national feed needs at least 10 headlines')

          jp_files = sorted(glob.glob('data/jp/*.json'))
          us_files = sorted(glob.glob('data/us/*.json'))
          if len(jp_files) != 47:
              raise SystemExit(f'Expected 47 prefecture files, got {len(jp_files)}')
          if len(us_files) != 50:
              raise SystemExit(f'Expected 50 state files, got {len(us_files)}')

          pref_map = read('data/maps/japan-prefectures.geojson')
          if len(pref_map.get('features', [])) != 47:
              raise SystemExit('Japan map must contain 47 prefecture features')

          def titles(path):
              return [a.get('title','').strip() for a in read(path).get('articles', [])[:10] if a.get('title')]

          def overlap(a, b):
              sa, sb = set(a), set(b)
              return len(sa & sb) / max(1, min(len(sa), len(sb)))

          tokyo, osaka, hokkaido = titles('data/jp/tokyo.json'), titles('data/jp/osaka.json'), titles('data/jp/hokkaido.json')
          if not tokyo or not osaka or not hokkaido:
              raise SystemExit('Tokyo/Osaka/Hokkaido feeds must contain headlines')
          if max(overlap(tokyo, osaka), overlap(tokyo, hokkaido), overlap(osaka, hokkaido)) >= 0.8:
              raise SystemExit('Japan prefecture feeds are too similar')

          california, texas, new_york = titles('data/us/california.json'), titles('data/us/texas.json'), titles('data/us/new-york.json')
          if not california or not texas or not new_york:
              raise SystemExit('California/Texas/New York feeds must contain headlines')
          us_overlaps = {
              'CA-TX': overlap(california, texas),
              'CA-NY': overlap(california, new_york),
              'TX-NY': overlap(texas, new_york),
          }
          if any(v >= 0.8 for v in us_overlaps.values()):
              raise SystemExit(f'US state feeds are too similar: {us_overlaps}')

          empty_us = [p for p in us_files if not read(p).get('articles')]
          print('Japan national:', len(jp.get('articles', [])))
          print('Japan prefectures:', len(jp_files))
          print('US national:', len(us.get('articles', [])))
          print('US states:', len(us_files))
          print('US sample overlaps:', us_overlaps)
          if empty_us:
              print('WARNING: empty US state feeds:', ', '.join(empty_us))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
