name: Deploy World News Globe

on:
  push:
    branches: [main]
  schedule:
    # Every two hours (UTC), instead of twice per hour.
    - cron: '7 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: world-news-pages-${{ github.ref }}
  # Do not cancel a running release when a new run is queued.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      ready: ${{ steps.refresh.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Offline deployment safety tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Restore last-known-good snapshot
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data
          key: news-cache-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            news-cache-${{ github.repository_id }}-

      - name: Bootstrap from last published Pages if cache is missing
        run: python3 scripts/restore_cache.py

      - name: Refresh news (leave previous site live if upstream fails)
        id: refresh
        run: python3 scripts/refresh_site_data.py

      - name: Validate publishable snapshot
        if: steps.refresh.outputs.ready == 'true'
        run: python3 scripts/validate_site_data.py

      - name: Save last-known-good snapshot
        if: steps.refresh.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data
          key: news-cache-${{ github.repository_id }}-${{ github.run_id }}

      - name: Setup Pages
        if: steps.refresh.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: steps.refresh.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: No publish required
        if: steps.refresh.outputs.ready != 'true'
        run: echo "::notice::Upstream data was unavailable. Retaining the last deployed site without failing the workflow."

  deploy:
    if: needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 10); do
            count="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)"
            if [[ "$count" =~ ^[0-9]+$ ]] && (( count > 0 )); then
              echo "Pages artifact is visible (attempt $attempt)"
              exit 0
            fi
            echo "Artifact not visible yet ($attempt/10); retrying in 6 seconds"
            sleep 6
          done
          echo "::error::Pages artifact could not be found after retries"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
