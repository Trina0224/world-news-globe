name: Deploy World News Globe

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Google News RSS
        run: python3 scripts/fetch_news.py
      - name: Validate generated news
        run: |
          test -s data/countries/jp.json
          python3 - <<'PY'
          import glob, json

          with open('data/countries/jp.json', encoding='utf-8') as f:
              national = json.load(f)
          national_count = len(national.get('articles', []))
          if national_count < 10:
              raise SystemExit(f'Need at least 10 Japan headlines, got {national_count}')

          files = sorted(glob.glob('data/jp/*.json'))
          if len(files) != 47:
              raise SystemExit(f'Expected 47 prefecture files, got {len(files)}')

          empty = []
          total = 0
          for path in files:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              count = len(data.get('articles', []))
              total += count
              if count == 0:
                  empty.append(path)

          def titles(path):
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              return [a.get('title','').strip() for a in data.get('articles', [])[:10] if a.get('title')]

          tokyo = titles('data/jp/tokyo.json')
          osaka = titles('data/jp/osaka.json')
          hokkaido = titles('data/jp/hokkaido.json')
          if not tokyo or not osaka or not hokkaido:
              raise SystemExit('Tokyo/Osaka/Hokkaido feeds must all contain headlines')

          def overlap(a, b):
              sa, sb = set(a), set(b)
              return len(sa & sb) / max(1, min(len(sa), len(sb)))

          overlaps = {
              'Tokyo-Osaka': overlap(tokyo, osaka),
              'Tokyo-Hokkaido': overlap(tokyo, hokkaido),
              'Osaka-Hokkaido': overlap(osaka, hokkaido),
          }
          print('Japan national headlines:', national_count)
          print('Prefecture feeds:', len(files))
          print('Prefecture headlines total:', total)
          print('Sample overlaps:', overlaps)
          if any(v >= 0.8 for v in overlaps.values()):
              raise SystemExit(f'Prefecture feeds are too similar: {overlaps}')
          if empty:
              print('WARNING: empty prefecture feeds:', ', '.join(empty))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
