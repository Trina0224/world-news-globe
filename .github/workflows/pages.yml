name: Deploy World News Globe

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Google News RSS
        run: python3 scripts/fetch_news.py
      - name: Show generated news
        run: |
          test -s data/countries/jp.json
          python3 - <<'PY'
          import json
          with open('data/countries/jp.json', encoding='utf-8') as f:
              data = json.load(f)
          print('Japan headlines:', len(data.get('articles', [])))
          print('Generated:', data.get('generated_at'))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
