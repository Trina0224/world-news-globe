name: Deploy World News Globe

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Google News RSS
        run: python3 scripts/fetch_news.py
      - name: Validate generated news
        run: |
          test -s data/countries/jp.json
          python3 - <<'PY'
          import glob, json

          with open('data/countries/jp.json', encoding='utf-8') as f:
              national = json.load(f)
          national_count = len(national.get('articles', []))
          if national_count < 10:
              raise SystemExit(f'Need at least 10 Japan headlines, got {national_count}')

          files = sorted(glob.glob('data/jp/*.json'))
          if len(files) != 47:
              raise SystemExit(f'Expected 47 prefecture files, got {len(files)}')

          empty = []
          total = 0
          for path in files:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              count = len(data.get('articles', []))
              total += count
              if count == 0:
                  empty.append(path)

          print('Japan national headlines:', national_count)
          print('Prefecture feeds:', len(files))
          print('Prefecture headlines total:', total)
          if empty:
              print('WARNING: empty prefecture feeds:', ', '.join(empty))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
